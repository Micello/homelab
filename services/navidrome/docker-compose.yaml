services:
  navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000 
    ports:
      - "4533:4533"
    restart: unless-stopped
    volumes:
      - "/home/simo/docker/navidrome/data:/data"
      - "/home/simo/Drive/Drive1/Musica:/music:ro"
  filebrowser:
      image: gtstef/filebrowser:beta-slim
      container_name: filebrowser
      user: 1000:1000
      ports:
        - "8080:80"
      restart: unless-stopped
      volumes:
        - "/home/simo/Drive/Drive1:/srv"
