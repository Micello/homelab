---
- name: Configure Raspberry Pi homelab
  hosts: homelab
  become: true

  tasks:
    - name: Ensure NFS server is installed
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present

    - name: Configure NFS exports
      ansible.builtin.copy:
        dest: /etc/exports
        owner: root
        group: root
        mode: "0644"
        content: |
          # /etc/exports
          # Managed by Ansible

          /home/simo/Drive/Drive1 100.64.0.0/10(rw,sync,no_subtree_check)
          /home/simo/Drive/Drive1 192.168.1.0/24(rw,sync,no_subtree_check)
      notify: Reload NFS exports

    - name: Ensure NFS server is enabled and running
      ansible.builtin.systemd_service:
        name: nfs-kernel-server
        enabled: true
        state: started

    - name: Ensure Docker packages are installed
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-buildx
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Ensure simo is in the docker group
      ansible.builtin.user:
        name: simo
        groups: docker
        append: true

    - name: Ensure homelab services directory exists
      ansible.builtin.file:
        path: /home/simo/homelab/services
        state: directory
        owner: simo
        group: simo
        mode: "0755"

    - name: Ensure Navidrome data directory exists
      ansible.builtin.file:
        path: /home/simo/docker/navidrome/data
        state: directory
        owner: simo
        group: simo
        mode: "0755"

    - name: Ensure homelab Docker services are running
      community.docker.docker_compose_v2:
        project_src: /home/simo/homelab/services
        state: present
      become_user: simo

    - name: Deploy AWS backup systemd service
      ansible.builtin.copy:
        src: systemd/aws-backup.service
        dest: /etc/systemd/system/aws-backup.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Deploy AWS backup systemd timer
      ansible.builtin.copy:
        src: systemd/aws-backup.timer
        dest: /etc/systemd/system/aws-backup.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Ensure AWS backup timer is enabled and running
      ansible.builtin.systemd_service:
        name: aws-backup.timer
        enabled: true
        state: started

  handlers:
    - name: Reload NFS exports
      ansible.builtin.command:
        cmd: exportfs -ra
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true